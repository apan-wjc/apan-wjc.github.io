site_name: APan MkDocs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky   # keeps tabs visible when scrolling
    - navigation.sections      # groups sidebar items into labeled sections
    - navigation.top           # adds a "back to top" button
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: index.md
  - About: about.md
  - Note:
      - Overview: note/index.md
      - Linux Tips: note/linux-tips.md
      - Networking: note/networking.md
  - Tech:
      - Overview: tech/index.md
      - Python: tech/python.md
      - MkDocs Setup: tech/mkdocs-setup.md
