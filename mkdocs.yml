INHERIT: ./nav.yml

site_name: APan MkDocs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list   # for extra CSS
  - termynal:
      prompt_literal_start:
        - "#"
        - "$"
        - ">"
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang:
        - en
        - zh
  - git-revision-date-localized:
      # type: timeago       # e.g. "3 days ago"
      # type: date          # e.g. "August 4, 2026"
      # type: datetime        # e.g. "August 4, 2026 14:30"
      type: custom
      custom_format: "%Y-%m-%d %H.%M"
      timezone: America/Vancouver
      locale: en
      fallback_to_build_date: true   # avoids errors on files not yet committed to git
      enable_creation_date: true
  - tags:
  - termynal
  - macros:   # pip install mkdocs-macros-plugin, to make md file live replacement working
      include_yaml:
        - cc: docs/dushu/ChineseCultrure.yml
        - lgj: docs/note/legoj.yml
        - lgx: docs/note/legox.yml

theme:
  name: material
  icon:
    logo: material/snowflake-variant       # sigma/panda/roman-numeral-9/snowflake-variant
  favicon: assets/snowflake-variant.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky   # keeps tabs visible when scrolling
    - navigation.indexes       # lets a folder's index.md serve as its landing page
    # - navigation.sections      # groups sidebar items into labeled sections
    - navigation.top           # adds a "back to top" button
    - content.code.copy        # 代码内容给一个复制按钮
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
